server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: sarovar-smartstay-backend

  datasource:
    # In-memory H2 DB by default for zero-config demonstration
    # Change to jdbc:mysql://localhost:3306/sarovar_smartstay for MySQL
    url: ${DB_URL:jdbc:h2:mem:sarovardb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expirationMs: 86400000 # 24 hours

logging:
  level:
    root: INFO
    com.sarovar.smartstay: DEBUG
    org.springframework.security: INFO
